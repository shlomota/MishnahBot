<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<canvas id="c" width="1280" height="720"></canvas>
<script src="primitives.js"></script>
<script src="timing.js"></script>
<script src="scenes.js"></script>
<script>
window.addEventListener('error', (e) => { window.pageError = e.message + ' @ ' + e.filename + ':' + e.lineno; });
C = document.getElementById('c');
X = C.getContext('2d');

function drawFrame(t) {
  background(t);
  const segs = window.TIMING.segments;
  const seg = segs.find((s) => t >= s.start && t < s.end) || segs[segs.length - 1];
  const lt = t - seg.start;
  const fn = window.SCENES && window.SCENES[seg.scene];
  if (fn) {
    try {
      fn(lt, seg.dur, seg.cue || [], seg);
    } catch (e) {
      text('(scene error: ' + seg.scene + ')', W / 2, H / 2, 24, RED);
    }
  }
  hud(t, window.TIMING.duration, window.TIMING.titleHeb);
}

window.ready = true;
</script>
</body>
</html>
